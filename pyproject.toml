[project]
name = "f1-stats"
version = "0.1.0"
description = "Sync and save F1 Fantasy statistics from f1fantasytools.com"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
f1-stats = "f1_stats.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
